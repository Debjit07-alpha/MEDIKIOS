  <path d="M 426 715 C 395 620, 380 500, 405 405 C 425 340, 475 365, 515 365 C 575 365, 625 395, 655 450 C 670 480, 672 505, 670 525 C 645 470, 595 425, 530 422 C 475 422, 435 455, 415 520 C 395 585, 405 660, 426 715 Z" fill="url(#mk-orange-body)"/>

