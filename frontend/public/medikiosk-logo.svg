  <path d="M 504 470 C 504 460, 512 452, 522 452 L 562 452 C 572 452, 580 460, 580 470 L 580 494 L 614 494 C 624 494, 632 502, 632 512 L 632 552 C 632 562, 624 570, 614 570 L 580 570 L 580 610 C 580 620, 572 628, 562 628 L 522 628 C 512 628, 504 620, 504 610 L 504 570 L 470 570 C 460 570, 452 562, 452 552 L 452 512 C 452 502, 460 494, 470 494 L 504 494 Z" fill="url(#mk-cross)"/>

