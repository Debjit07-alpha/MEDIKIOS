  <circle cx="740" cy="257" r="74" fill="url(#mk-cyan-head)"/>
  <path d="M 410 348 C 480 336, 580 320, 675 300 C 730 335, 770 410, 765 490 C 760 580, 715 670, 635 735 C 570 785, 500 755, 460 748 C 540 735, 620 680, 670 600 C 705 530, 705 440, 665 375 C 630 325, 560 340, 485 355 C 450 362, 425 355, 410 348 Z" fill="url(#mk-cyan-body)"/>

