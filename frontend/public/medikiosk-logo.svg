<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 1000" fill="none" role="img" aria-label="MediKiosk Care Logo">
  <defs>
    <!-- Green figure gradients -->
    <linearGradient id="mk-green-head" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#a8e800"/>
      <stop offset="100%" stop-color="#56be00"/>
    </linearGradient>
    <linearGradient id="mk-green-body" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#a4e200"/>
      <stop offset="55%" stop-color="#6bc600"/>
      <stop offset="100%" stop-color="#4ab200"/>
    </linearGradient>

    <!-- Cyan/blue figure gradients -->
    <linearGradient id="mk-cyan-head" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00d7f8"/>
      <stop offset="100%" stop-color="#0084d6"/>
    </linearGradient>
    <linearGradient id="mk-cyan-body" x1="85%" y1="20%" x2="25%" y2="90%">
      <stop offset="0%" stop-color="#00cdf3"/>
      <stop offset="55%" stop-color="#0097e2"/>
      <stop offset="100%" stop-color="#0072c8"/>
    </linearGradient>

    <!-- Orange figure gradients -->
    <linearGradient id="mk-orange-head" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#f56e00"/>
    </linearGradient>
    <linearGradient id="mk-orange-body" x1="15%" y1="25%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="50%" stop-color="#fb8700"/>
      <stop offset="100%" stop-color="#f05b00"/>
    </linearGradient>

    <!-- Medical cross gradient -->
    <linearGradient id="mk-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24d2ff"/>
      <stop offset="100%" stop-color="#00aff0"/>
    </linearGradient>

    <!-- Hands gradients -->
    <linearGradient id="mk-hand-outer-left" x1="10%" y1="35%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#102574"/>
      <stop offset="45%" stop-color="#0c3f9c"/>
      <stop offset="85%" stop-color="#0263c9"/>
      <stop offset="100%" stop-color="#0275db"/>
    </linearGradient>
    <linearGradient id="mk-hand-inner-left" x1="20%" y1="45%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#15368a"/>
      <stop offset="50%" stop-color="#0b52b5"/>
      <stop offset="100%" stop-color="#037fe0"/>
    </linearGradient>

    <linearGradient id="mk-hand-outer-right" x1="90%" y1="35%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#102574"/>
      <stop offset="45%" stop-color="#0c3f9c"/>
      <stop offset="85%" stop-color="#0263c9"/>
      <stop offset="100%" stop-color="#0275db"/>
    </linearGradient>
    <linearGradient id="mk-hand-inner-right" x1="80%" y1="45%" x2="25%" y2="95%">
      <stop offset="0%" stop-color="#15368a"/>
      <stop offset="50%" stop-color="#0b52b5"/>
      <stop offset="100%" stop-color="#037fe0"/>
    </linearGradient>
  </defs>

  <!-- Green Figure (Top-Left) -->
  <circle cx="331" cy="115" r="72" fill="url(#mk-green-head)"/>
  <path d="M 285 172 C 340 170, 435 176, 535 218 C 585 238, 630 258, 664 276 C 610 248, 545 224, 475 214 C 425 208, 385 220, 360 250 C 340 330, 345 440, 380 540 C 410 610, 460 655, 498 646 C 425 615, 365 540, 320 440 C 275 340, 270 245, 285 172 Z" fill="url(#mk-green-body)"/>

