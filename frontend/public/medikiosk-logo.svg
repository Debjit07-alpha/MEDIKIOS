  <path d="M 172 425 C 150 490, 148 600, 185 710 C 235 840, 340 925, 492 960 C 502 962, 508 961, 508 961 C 508 961, 410 930, 335 845 C 265 765, 230 655, 215 540 C 205 470, 195 430, 172 425 Z" fill="url(#mk-hand-outer-left)"/>
  <path d="M 272 610 C 285 675, 335 760, 415 825 C 475 870, 508 880, 508 880 C 508 880, 450 840, 385 770 C 330 705, 290 635, 272 610 Z" fill="url(#mk-hand-inner-left)"/>

  <!-- Cupped Hands (Right Hand - Outer Wing & Inner Finger) -->
  <path d="M 844 425 C 866 490, 868 600, 831 710 C 781 840, 676 925, 524 960 C 514 962, 508 961, 508 961 C 508 961, 606 930, 681 845 C 751 765, 786 655, 801 540 C 811 470, 821 430, 844 425 Z" fill="url(#mk-hand-outer-right)"/>
  <path d="M 744 610 C 731 675, 681 760, 601 825 C 541 870, 508 880, 508 880 C 508 880, 566 840, 631 770 C 686 705, 726 635, 744 610 Z" fill="url(#mk-hand-inner-right)"/>
</svg>
